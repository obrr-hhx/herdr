name: Bug report
description: Report a bug in this Herdr fork.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem in the community fork.
        Read [CONTRIBUTING.md](https://github.com/obrr-hhx/herdr/blob/master/CONTRIBUTING.md),
        search existing issues, and remove credentials and private details from logs.
        Intermittent reports are welcome; distinguish observed behavior from hypotheses.

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give exact steps if known; otherwise describe when it happened and what remains unconfirmed.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Herdr version, update channel, operating system, and terminal are required. Shell and relevant config are optional.
      value: |
        - Herdr version:
        - Build/channel (fork, stable, or preview):
        - Operating system:
        - Terminal:
        - Shell, if relevant:
        - Relevant config, if any:
    validations:
      required: true
